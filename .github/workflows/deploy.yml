name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Publish Update to Expo Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Project Dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Publish EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update --branch main --platform android --message "${{ github.event.head_commit.message }}"
          eas update --branch main --platform ios --message "${{ github.event.head_commit.message }}"